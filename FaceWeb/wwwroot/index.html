<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horologium — Face</title>
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
            background: #1C1C28;
        }

        #out {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<div id="out"></div>
<script>
    // dotnet.runtime.js only forwards ~10 runtime_idx-wrapped functions to WebAssembly.instantiate,
    // discarding the other ~460 emscripten imports (GL, __assert_fail, syscalls, etc.) that
    // dotnet.native.js builds in wasmImports. dotnet.native.js exposes window._wasmImports so we
    // can merge the missing entries here before instantiation.
    const _origWasmInstantiate = WebAssembly.instantiate;
    WebAssembly.instantiate = function (source, importObject, ...rest) {
        if (importObject && (importObject.env || importObject.a)) {
            const env = importObject.env || importObject.a;
            const full = window._wasmImports;
            if (full) {
                for (const k of Object.keys(full)) {
                    if (!(k in env)) env[k] = full[k];
                }
            }
        }
        return _origWasmInstantiate.call(WebAssembly, source, importObject, ...rest);
    };
</script>
<script type="module" src="./FaceWeb.js"></script>
</body>
</html>
